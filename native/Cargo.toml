[package]
name = "runwa-native"
version = "0.1.0"
edition = "2021"
publish = false

# napi-rs facade for the Electron build. The platform code lives in
# `crates/runwa-core`; this crate only converts its types to JS values.

[lib]
crate-type = ["cdylib"]

[dependencies]
runwa-core = { path = "../crates/runwa-core" }
# Pinned to avoid MSRV bumps in newer 2.x releases. These are the latest
# versions that build with rustc 1.87. Bump when `rustup update` lands.
napi = { version = "=2.16.17", default-features = false, features = ["napi4"] }
napi-derive = "=2.16.13"

[build-dependencies]
napi-build = "=2.1.6"

[profile.release]
lto = true
strip = "symbols"
