name: Refresh bedware.software
# Each event rebuilds the site once:
# - a push to main that changes the README or the screenshots;
# - a version: after a successful "Build distributables" run from a tag push. No `release`
#   trigger: build.yml publishes the release with GITHUB_TOKEN, which starts no workflows.
# - a manual run.
on:
  push:
    branches: [main]
    paths: [README.md, 'docs/screenshots/**']
  workflow_run:
    workflows: ['Build distributables']
    types: [completed]
  workflow_dispatch:
permissions: {}
jobs:
  rebuild:
    # build.yml runs on a push only for a `v*` tag, so event 'push' means a version.
    # scripts/release.mjs commits the retaken screenshots as "[release] ..." just before
    # the tag; that push is skipped, the build of the tag refreshes the site with the new
    # version and images together.
    if: >-
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, '[release] '))
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Request site build
        env:
          DEPLOY_URL: ${{ secrets.COOLIFY_SITE_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.COOLIFY_SITE_TOKEN }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "::notice::Site deployment is not configured."
            exit 0
          fi
          # Coolify accepts a deploy request only as POST (a GET gets 405).
          curl --fail --silent --show-error --max-time 30 --output /dev/null --request POST \
            --header "Authorization: Bearer $DEPLOY_TOKEN" "$DEPLOY_URL"
